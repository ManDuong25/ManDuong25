name: Daily Quest & EXP Sync

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    # Midnight 00:00 UTC+7 (Vietnam Time) is 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - reset

permissions:
  contents: write
  issues: write

jobs:
  sync-quests:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue != null && (github.event.issue.number == 1 || contains(github.event.issue.title, 'Daily Quest')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Quests & Compute Level Progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_ACTION" = "reset" ]; then
            echo "Running midnight quest reset..."
            node scripts/sync-quests.mjs --reset
          else
            echo "Running quest sync..."
            node scripts/sync-quests.mjs
          fi

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update daily quests & level progress [skip ci]" && git push)
