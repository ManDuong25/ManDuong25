name: Daily Quest & EXP Sync

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    # Vietnam Midnight (00:00 UTC+7) is 17:00 UTC
    # Minute 5 avoids GitHub Actions :00 congestion queue drops
    - cron: '5 17 * * *'    # 00:05 VN (primary midnight rollover)
    - cron: '35 17 * * *'   # 00:35 VN (backup 1)
    - cron: '5 18 * * *'    # 01:05 VN (backup 2)
    - cron: '5 23 * * *'    # 06:05 VN (morning sanity check)
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - reset

permissions:
  contents: write
  issues: write

jobs:
  sync-quests:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue != null && (github.event.issue.number == 1 || contains(github.event.issue.title, 'Daily Quest')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Quests & Compute Level Progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "Running scheduled daily quest check / rollover..."
            node scripts/sync-quests.mjs --schedule
          elif [ "$INPUT_ACTION" = "reset" ]; then
            echo "Running forced midnight reset..."
            node scripts/sync-quests.mjs --reset --force
          else
            echo "Running quest sync..."
            node scripts/sync-quests.mjs
          fi

      - name: Commit and Push Updated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update daily quests & level progress [skip ci]"
            SHA=$(git rev-parse HEAD)
            sed -i -E "s|https://raw\.githubusercontent\.com/ManDuong25/ManDuong25/[a-f0-9]+/assets/|https://raw.githubusercontent.com/ManDuong25/ManDuong25/${SHA}/assets/|g" README.md
            git add README.md
            git commit -m "chore(readme): point HUD assets to latest commit [skip ci]"
            git push
          fi
