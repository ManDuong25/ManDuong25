<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="DƯƠNG CÔNG MÃN // GitHub Profile">
  <title>DƯƠNG CÔNG MÃN — Profile Hero</title>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f3f6fa" />
      <stop offset="100%" stop-color="#e9eff7" />
    </linearGradient>

    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0860ca" />
      <stop offset="100%" stop-color="#7642d8" />
    </linearGradient>

    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0860ca" stop-opacity="0.195" />
      <stop offset="55%" stop-color="#7642d8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0860ca" stop-opacity="0" />
    </radialGradient>

    <clipPath id="heroClip">
      <rect x="0" y="0" width="900" height="280" rx="14" />
    </clipPath>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }

    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes pulseSoft { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.45; } }
    /* Plays ONCE on load/reload, grows from the centre dot (local origin 0,0), then stays */
    @keyframes spiderBloomOnce {
      0%, 12% { transform: scale(0); opacity: 0; }
      85%     { transform: scale(1.03); opacity: 1; }
      100%    { transform: scale(1); opacity: 1; }
    }

    .caret { animation: blink 1.05s step-end infinite; }
    .pulse-dot { animation: pulseSoft 2s ease-in-out infinite; }
    .leading-segment { animation: pulseSoft 1.3s ease-in-out infinite; }
    .spider-bloom-group {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: spiderBloomOnce 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s 1 both;
    }
  </style>

  
  <!-- FRAMELESS: Clean subtle hairline boundary rules -->
  <line x1="0" y1="0.5" x2="900" y2="0.5" stroke="#d1d9e0" stroke-width="1" opacity="0.45" />
  <line x1="0" y1="279.5" x2="900" y2="279.5" stroke="#d1d9e0" stroke-width="1" opacity="0.45" />
  

  <!-- ============ COL1 — identity (x=48) ============ -->
  <g transform="translate(48, 0)">
    <!-- whoami: HIGHEST element on the canvas (baseline y=42, top ink at y=32.0) -->
    <text x="-0.5" y="42" class="mono" font-size="13.5" font-weight="600" fill="#0860ca">manduong ~ $ whoami</text>
    <rect class="caret" x="160" y="30" width="8" height="14" fill="#0860ca" />

    <!-- Name (headline) -->
    <text x="-1.8" y="92"><tspan class="sans" font-size="32" font-weight="800" fill="#1f2328" letter-spacing="-0.4">DƯƠNG CÔNG MÃN</tspan></text>

    <!-- accent rule: optically centred between Name baseline and Role cap-top -->
    <rect x="0" y="106" width="68" height="3.5" rx="1.75" fill="url(#accentG)" />

    <!-- Role -->
    <text x="-0.6" y="150" class="sans" font-size="16" font-weight="500" fill="#59636e">Software &amp; AI Engineer</text>

    <!-- Level row at bottom -->
    <text x="-0.8" y="218" class="mono" font-size="12" font-weight="700" fill="#17692e">LVL.03<tspan font-weight="500" fill="#656d76" dx="12">PROGRESS</tspan></text>
    <text x="246" y="218" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#17692e">0 / 200 EXP</text>
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="18" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="36" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="54" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="72" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="90" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="108" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="126" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="144" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="162" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="180" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="198" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="216" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" /><rect x="234" y="0" width="13" height="7" rx="2" fill="rgba(31, 35, 40, 0.08)" />
    </g>
  </g>

  <!-- ============ COL2 — facts (x=475); starts at y=78 aligned with letter D ============ -->
  <g>
    <text x="475" y="78" class="mono" font-size="11" font-weight="700" fill="#59636e">ABOUT<tspan font-weight="400" fill="#656d76" dx="8.8">//</tspan><tspan fill="#17692e" font-weight="600" dx="8.8">ME</tspan></text>
    
    <text x="474.3" y="106" class="mono" font-size="11" font-weight="600" fill="#656d76">FOCUS</text>
    <text x="474.7" y="126" class="sans" font-size="14.5" font-weight="700" fill="#1f2328">Software &amp; AI Engineering</text>
    
    <text x="474.5" y="158" class="mono" font-size="11" font-weight="600" fill="#656d76">CAMPUS</text>
    <text x="474.7" y="178" class="sans" font-size="14.5" font-weight="700" fill="#0860ca">Sài Gòn University</text>
    
    <text x="474.5" y="218" class="mono" font-size="11" font-weight="600" fill="#656d76">DAILY COMPOUND</text>
    <text x="474.2" y="238" class="mono" font-size="14.5" font-weight="700" fill="#17692e">1.01³⁶⁵ ≈ 37.8x</text>
  </g>

  <!-- ============ COL3 — radar (axis x=766) ============ -->
  <g>
    <g transform="translate(766, 168)">
      <polygon points="0,-52 49.46,-16.07 30.57,42.07 -30.57,42.07 -49.46,-16.07" fill="none" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />
      <polygon points="0,-34.67 32.97,-10.71 20.38,28.05 -20.38,28.05 -32.97,-10.71" fill="none" stroke="rgba(31, 35, 40, 0.12)" stroke-width="0.9" stroke-dasharray="3 3" />
      <polygon points="0,-17.33 16.49,-5.36 10.19,14.02 -10.19,14.02 -16.49,-5.36" fill="none" stroke="rgba(31, 35, 40, 0.12)" stroke-width="0.8" />
      <line x1="0" y1="0" x2="0" y2="-54.08" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />
      <line x1="0" y1="0" x2="51.44" y2="-16.71" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />
      <line x1="0" y1="0" x2="31.79" y2="43.75" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-31.79" y2="43.75" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-51.44" y2="-16.71" stroke="rgba(31, 35, 40, 0.12)" stroke-width="1.2" />

      <!-- the real spider web: blooms dynamically from current attribute stats -->
      <g class="spider-bloom-group">
        <polygon points="0,-2.6 49.46,-16.07 30.57,42.07 -30.57,42.07 -2.47,-0.8" fill="rgba(8, 96, 202, 0.12)" stroke="#0860ca" stroke-width="2" stroke-linejoin="round" filter="url(#softGlow)" />
        <circle cx="49.46" cy="-16.07" r="2.6" fill="#0860ca" />
        <circle cx="30.57" cy="42.07" r="2.6" fill="#0860ca" />
        <circle cx="-30.57" cy="42.07" r="2.6" fill="#0860ca" />
      </g>

      <circle cx="0" cy="0" r="3" fill="#17692e" class="pulse-dot" />

      <text x="0" y="-61" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#656d76">TECH</text>
      <text x="57.46" y="-12.07" class="mono" font-size="11" font-weight="700" text-anchor="start" fill="#656d76">INTELLECT</text>
      <text x="38.57" y="48.07" class="mono" font-size="11" font-weight="700" text-anchor="start" fill="#656d76">VITALITY</text>
      <text x="-38.57" y="48.07" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#656d76">GRIT</text>
      <text x="-57.46" y="-12.07" class="mono" font-size="11" font-weight="700" text-anchor="end" fill="#656d76">OUTPUT</text>
    </g>
  </g>
</svg>