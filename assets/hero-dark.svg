<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="DƯƠNG CÔNG MÃN // GitHub Profile">
  <title>DƯƠNG CÔNG MÃN — Profile Hero</title>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="45%" stop-color="#121926" />
      <stop offset="100%" stop-color="#1b2230" />
    </linearGradient>

    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39c5cf" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39c5cf" stop-opacity="0.208" />
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.096" />
      <stop offset="100%" stop-color="#39c5cf" stop-opacity="0" />
    </radialGradient>

    <clipPath id="heroClip">
      <rect x="0" y="0" width="900" height="220" rx="14" />
    </clipPath>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }

    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes pulseSoft { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.45; } }
    /* Plays ONCE on load/reload, grows from the centre dot (local origin 0,0), then stays */
    @keyframes spiderBloomOnce {
      0%, 12% { transform: scale(0); opacity: 0; }
      85%     { transform: scale(1.03); opacity: 1; }
      100%    { transform: scale(1); opacity: 1; }
    }

    .caret { animation: blink 1.05s step-end infinite; }
    .pulse-dot { animation: pulseSoft 2s ease-in-out infinite; }
    .leading-segment { animation: pulseSoft 1.3s ease-in-out infinite; }
    .spider-bloom-group {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: spiderBloomOnce 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s 1 both;
    }
  </style>

  <!-- Single outer frame -->
  <rect x="0.5" y="0.5" width="899" height="219" rx="14" fill="url(#bgG)" stroke="#30363d" stroke-width="1" />

  <g clip-path="url(#heroClip)">
    <!-- Ambient glow bridging COL2 and COL3, centred on the middle row axis -->
    <ellipse cx="620" cy="113" rx="270" ry="140" fill="url(#meshGlow)" />
  </g>

  <!-- ============ COL1 — identity (x=48) ============ -->
  <g transform="translate(48, 0)">
    <!-- whoami: HIGHEST element on the canvas (baseline y=35) -->
    <text x="-0.5" y="35" class="mono" font-size="12" font-weight="600" fill="#39c5cf" textLength="136.8" lengthAdjust="spacing">manduong ~ $ whoami</text>
    <rect class="caret" x="142.8" y="25" width="7" height="12" fill="#39c5cf" />

    <!-- Name + handle share ONE baseline (y=75) -->
    <text x="-1.8" y="75"><tspan class="sans" font-size="28" font-weight="800" fill="#e6edf3" letter-spacing="-0.4">DƯƠNG CÔNG MÃN</tspan><tspan class="mono" font-size="14" font-weight="600" fill="#39c5cf" dx="14">// ManDuong</tspan></text>

    <!-- accent rule: optically centred between Name baseline and Role cap-top -->
    <rect x="0" y="87.5" width="60" height="3" rx="1.5" fill="url(#accentG)" />

    <!-- Role -->
    <text x="-0.6" y="113" class="sans" font-size="14" font-weight="500" fill="#8b949e">Software &amp; AI Engineer · Final-year CS @ SGU</text>

    <!-- Level row; 14 slots x 15px pitch → bar right edge = 206 = right edge of the % -->
    <text x="-0.8" y="151" class="mono" font-size="10" font-weight="700" fill="#3fb950">LVL.01<tspan font-weight="500" fill="#848d97" dx="12">EXP PROGRESS</tspan></text>
    <text x="206" y="151" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#3fb950">12%</text>
    <g transform="translate(0, 158)">
      <rect x="0" y="0" width="11" height="5" rx="1.5" fill="#3fb950" opacity="0.9" /><rect class="leading-segment" x="15" y="0" width="11" height="5" rx="1.5" fill="#3fb950" filter="url(#softGlow)" /><rect x="30" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="45" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="60" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="75" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="90" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="105" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="120" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="135" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="150" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="165" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="180" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" /><rect x="195" y="0" width="11" height="5" rx="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </g>

    <!-- Philosophy quote -->
    <text x="-1" y="189" class="sans" font-size="12" font-weight="500" font-style="italic" fill="#848d97">"Life is just a game — just striving to be a little better every day."</text>
  </g>

  <!-- ============ COL2 — facts (x=490); starts at y=62.5 aligned with letter D ============ -->
  <g>
    <text x="490" y="62.5" class="mono" font-size="9" font-weight="700" fill="#8b949e">ABOUT<tspan font-weight="400" fill="#848d97" dx="8.8">//</tspan><tspan fill="#3fb950" font-weight="600" dx="8.8">ME</tspan></text>
    
    <text x="489.3" y="85" class="mono" font-size="9" font-weight="600" fill="#848d97">FOCUS</text>
    <text x="489.7" y="101" class="sans" font-size="12" font-weight="700" fill="#e6edf3">Software &amp; AI Engineering</text>
    
    <text x="489.5" y="123" class="mono" font-size="9" font-weight="600" fill="#848d97">CAMPUS</text>
    <text x="489.7" y="139" class="sans" font-size="12" font-weight="700" fill="#39c5cf">Sài Gòn University</text>
    
    <text x="489.5" y="161" class="mono" font-size="9" font-weight="600" fill="#848d97">DAILY COMPOUND</text>
    <text x="489.2" y="177" class="mono" font-size="12" font-weight="700" fill="#3fb950">1.01³⁶⁵ ≈ 37.8x</text>
  </g>

  <!-- ============ COL3 — radar (axis x=789); starts at y=62.5 aligned with letter D ============ -->
  <g>
    <!-- header: left edge = DESIGN label left edge (710); baseline = R_HEADER_RIGHT (62.5) -->
    <circle cx="713" cy="59" r="3" fill="#3fb950" class="pulse-dot" />
    <text x="721" y="62.5" class="mono" font-size="9" font-weight="700" fill="#8b949e">ATTRIBUTES<tspan font-weight="400" fill="#848d97" dx="8.8">//</tspan><tspan fill="#3fb950" font-weight="600" dx="8.8">SYS.READY</tspan></text>

    <g transform="translate(789, 136)">
      <polygon points="0,-42 36.37,-21 36.37,21 0,42 -36.37,21 -36.37,-21" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1" />
      <polygon points="0,-28 24.25,-14 24.25,14 0,28 -24.25,14 -24.25,-14" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.8" stroke-dasharray="2 2" />
      <polygon points="0,-14 12.12,-7 12.12,7 0,14 -12.12,7 -12.12,-7" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.6" />
      <line x1="0" y1="43.68" x2="0" y2="-43.68" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.8" />
      <line x1="-37.82" y1="21.84" x2="37.82" y2="-21.84" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.8" />
      <line x1="-37.82" y1="-21.84" x2="37.82" y2="21.84" stroke="rgba(255, 255, 255, 0.10)" stroke-width="0.8" />

      <!-- the real spider web: blooms ONCE from the centre dot -->
      <g class="spider-bloom-group">
        <polygon points="0,-36.12 28.37,-16.38 33.46,19.32 0,36.12 -30.19,17.43 -25.46,-14.7" fill="rgba(57, 197, 207, 0.12)" stroke="#39c5cf" stroke-width="1.8" stroke-linejoin="round" filter="url(#softGlow)" />
        <circle cx="0" cy="-36.12" r="2.2" fill="#39c5cf" />
        <circle cx="28.37" cy="-16.38" r="2.2" fill="#39c5cf" />
        <circle cx="33.46" cy="19.32" r="2.2" fill="#39c5cf" />
        <circle cx="0" cy="36.12" r="2.2" fill="#39c5cf" />
        <circle cx="-30.19" cy="17.43" r="2.2" fill="#39c5cf" />
        <circle cx="-25.46" cy="-14.7" r="2.2" fill="#39c5cf" />
      </g>

      <circle cx="0" cy="0" r="2.6" fill="#3fb950" class="pulse-dot" />

      <text x="0" y="-49" class="mono" font-size="9" font-weight="700" text-anchor="middle" fill="#848d97">CODE</text>
      <text x="43.37" y="-17.8" class="mono" font-size="9" font-weight="700" text-anchor="start" fill="#848d97">SYS</text>
      <text x="43.37" y="24.2" class="mono" font-size="9" font-weight="700" text-anchor="start" fill="#848d97">AI</text>
      <text x="0" y="55.5" class="mono" font-size="9" font-weight="700" text-anchor="middle" fill="#848d97">LOGIC</text>
      <text x="-43.37" y="24.2" class="mono" font-size="9" font-weight="700" text-anchor="end" fill="#848d97">GRIT</text>
      <text x="-43.37" y="-17.8" class="mono" font-size="9" font-weight="700" text-anchor="end" fill="#848d97">DESIGN</text>
    </g>
  </g>
</svg>